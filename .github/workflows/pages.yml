name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 매일 06:00 KST 에 넥슨 API 데이터를 새로 받아 다시 배포
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      history_budget:
        description: '강화 기록 조회에 쓸 최대 호출 수 (0 이면 건너뜀)'
        default: '500'

permissions:
  contents: write # 강화 기록을 저장소에 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 강화 기록 커밋 전 rebase 용
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 넥슨 API 는 매일 아침 실행과 수동 실행에서만 부른다. 코드 push 배포는 커밋된 데이터를 쓰고,
      # 커밋된 데이터가 아직 없을 때만 한 번 받는다 (키 하루 사용량 절약)
      - id: plan
        run: |
          if [ "${{ github.event_name }}" != push ] || [ "$(node -p "require('./src/data/nexon.json').fetchedAt")" = null ]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch NEXON Open API data
        if: steps.plan.outputs.fetch == 'true'
        run: node scripts/fetch_nexon.mjs
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      - name: Fetch enhancement history
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.history_budget != '0')
        run: node scripts/fetch_history.mjs
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          HISTORY_BUDGET: ${{ inputs.history_budget || '500' }}
      - name: Commit fetched data
        if: steps.plan.outputs.fetch == 'true'
        run: |
          git add src/data/nexon.json data/history src/data/historySummary.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update NEXON data"
          git pull --rebase --autostash origin main && git push origin HEAD:main || echo "::warning::데이터 커밋 실패 (다음 실행에서 다시 받음)"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
