name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 매일 06:00 KST 에 넥슨 API 데이터를 새로 받아 다시 배포
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch NEXON Open API data
        run: node scripts/fetch_nexon.mjs
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
